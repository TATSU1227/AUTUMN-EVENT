<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141019">
<title>東京・神奈川 秋イベント 2026</title>
<style>
:root{
  --yoru:#141019;--sumi:#1d1722;
  --kaki:#e2653c;      /* 柿：グルメ */
  --kin:#e5b45a;       /* 銀杏：アクセント */
  --kin-d:#b98d34;
  --fuji:#a78bfa;      /* 藤：アート・展示 */
  --koke:#6fbf9b;      /* 苔：祭り・市 */
  --tsuki:#6fb6e8;     /* 月白：野外・夜あそび */
  --kinari:#f4eee2;
  --muted:rgba(244,238,226,.58);
  --line:rgba(229,180,90,.22);
  --card:rgba(255,255,255,.045);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1100px 560px at 50% -8%,#3a2542 0%,transparent 62%),
             linear-gradient(180deg,#141019 0%,#1a1422 46%,#221a26 100%);
  background-attachment:fixed;color:var(--kinari);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  font-size:15px;line-height:1.7;padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden;
}

/* ── ヒーロー ── */
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.hero{position:relative;overflow:hidden;padding:calc(env(safe-area-inset-top) + 34px) 20px 30px;text-align:center}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-in{position:relative;z-index:2}
.hero{z-index:1}
.eyebrow{font-size:11px;letter-spacing:.42em;color:var(--kin);margin:0 0 12px;text-indent:.42em}
h1.title{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(34px,10vw,52px);
  font-weight:600;letter-spacing:.06em;margin:0;line-height:1.25;text-shadow:0 0 26px rgba(229,180,90,.34)}
h1.title em{font-style:normal;color:var(--kin);display:block;font-size:calc(.7em - 4px);letter-spacing:.2em;margin-top:6px}
.tally{display:flex;justify-content:center;margin:22px auto 0;max-width:340px;
  border:1px solid var(--line);border-radius:999px;overflow:hidden;
  background:rgba(20,16,25,.5);backdrop-filter:blur(6px)}
.tally div{flex:1;padding:9px 4px;border-right:1px solid var(--line)}
.tally div:first-child{padding-left:12px}
.tally div:last-child{border-right:0;padding-right:12px}
.tally b{transition:color .2s;display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--kin);line-height:1.2}
.tally span{font-size:10px;color:var(--muted);letter-spacing:.1em}
.leaves{display:flex;justify-content:center;gap:15px;padding:4px 0 0;position:relative;z-index:2}
.leaf{width:14px;height:14px;background:linear-gradient(150deg,#f0b96a,#d1732f);
  border-radius:0 60% 0 60%;box-shadow:0 0 13px rgba(226,101,60,.5);animation:sway 3.8s ease-in-out infinite}
.leaf:nth-child(even){background:linear-gradient(150deg,#e88a6a,#c1442f);animation-delay:-1.3s}
.leaf:nth-child(3n){animation-delay:-2.5s;background:linear-gradient(150deg,#f2d089,#c99a3a)}
@keyframes sway{0%,100%{transform:translateY(0) rotate(-14deg)}50%{transform:translateY(4px) rotate(16deg)}}

/* ── コントロール ── */
.controls{position:relative;z-index:40;padding:14px 0 12px}
.row{display:flex;flex-wrap:wrap;gap:7px 6px;padding:0 16px 2px}
.row+.row{margin-top:7px}
.chip{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid rgba(244,238,226,.22);
  background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.04em;
  cursor:pointer;transition:.18s;font-family:inherit;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--kin);border-color:var(--kin);color:#1d1607;box-shadow:0 0 16px rgba(229,180,90,.4)}
.chip.c-f[aria-pressed="true"]{background:var(--kaki);border-color:var(--kaki);color:#fff;box-shadow:0 0 16px rgba(226,101,60,.5)}
.chip.c-a[aria-pressed="true"]{background:var(--fuji);border-color:var(--fuji);color:#180f33;box-shadow:0 0 16px rgba(167,139,250,.45)}
.chip.c-m[aria-pressed="true"]{background:var(--koke);border-color:var(--koke);color:#052e21;box-shadow:0 0 16px rgba(111,191,155,.4)}
.chip.c-o[aria-pressed="true"]{background:var(--tsuki);border-color:var(--tsuki);color:#062435;box-shadow:0 0 16px rgba(111,182,232,.4)}
.chip.c-g[aria-pressed="true"]{background:rgba(244,238,226,.9);border-color:rgba(244,238,226,.9);color:#1f1a26;box-shadow:0 0 14px rgba(244,238,226,.3)}
.row[hidden]{display:none}
.row.tools{align-items:center;gap:8px 7px}
.row .brk{flex:0 0 100%;height:0;margin:0;padding:0}
select,.srch{background:rgba(255,255,255,.06);border:1px solid rgba(244,238,226,.2);color:var(--kinari);
  border-radius:999px;padding:7px 13px;font-size:12.5px;font-family:inherit;flex:0 0 auto}
select{-webkit-appearance:none;appearance:none;padding-right:25px;
  flex:1 1 auto;min-width:0;text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--kin) 50%),linear-gradient(135deg,var(--kin) 50%,transparent 50%);
  background-position:calc(100% - 13px) 50%,calc(100% - 8px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.srch{flex:1 1 100%;min-width:0}
.srch::placeholder{color:rgba(244,238,226,.35)}
.toggle{display:flex;align-items:center;gap:5px;font-size:11.5px;white-space:nowrap;color:var(--muted);flex:0 0 auto;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--kin);width:15px;height:15px}
.toggle.dim{opacity:.38}
.toggle.live input{accent-color:#63b98f}
.toggle.nop input{accent-color:#8fdcb4}
.toggle.rain input{accent-color:#7fb6ff}
.toggle.night input{accent-color:#c3b8ff}
.toggle.fav input{accent-color:var(--kin)}
.toggle.fav b{color:var(--kin);font-weight:700;font-variant-numeric:tabular-nums}

/* ── リスト ── */
main{position:relative;z-index:1;padding:18px 14px 60px;max-width:640px;margin:0 auto}
.mhead{display:flex;align-items:baseline;gap:10px;margin:26px 2px 12px}
.mhead:first-child{margin-top:8px}
.mhead b{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:26px;color:var(--kin);letter-spacing:.04em}
.mhead.live b{font-size:21px;color:#8fdcb4}
.mhead.srt b{font-size:19px}
.mhead.live s{background:linear-gradient(90deg,rgba(99,185,143,.5),transparent)}
.mhead s{text-decoration:none;flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.mhead i{font-style:normal;font-size:11px;color:var(--muted)}

.card{display:flex;background:var(--card);border:1px solid rgba(244,238,226,.11);border-radius:12px;
  overflow:hidden;margin-bottom:10px;cursor:pointer;transition:.2s;position:relative}
.card:active{transform:scale(.988)}
.card.past{opacity:.42}
.card.f{border-left:3px solid var(--kaki)}
.card.a{border-left:3px solid var(--fuji)}
.card.m{border-left:3px solid var(--koke)}
.card.o{border-left:3px solid var(--tsuki)}

.dt{flex:0 0 60px;padding:12px 0;text-align:center;background:rgba(0,0,0,.22);display:flex;flex-direction:column;justify-content:center}
.dt .m{font-size:10px;color:var(--muted);letter-spacing:.08em}
.dt .d{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:27px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.dt .w{font-size:10px;margin-top:3px;color:var(--muted)}
.dt .w.sat{color:#7fb6ff}.dt .w.sun{color:#ff8f8f}
.dt .sp{font-size:9px;color:var(--kin);margin-top:3px}
.dt .sp.live{color:#8fdcb4}
.qd i.live{color:#8fdcb4}

.body{flex:1;min-width:0;padding:11px 13px 12px}
.nm{font-size:14.5px;font-weight:700;line-height:1.42;padding-right:30px}
.pl{font-size:11.5px;color:var(--muted);margin-top:2px;padding-right:30px}
.star{position:absolute;top:3px;right:3px;z-index:2;width:36px;height:36px;padding:0;border:0;
  background:none;color:rgba(244,238,226,.24);font-size:18px;line-height:36px;text-align:center;
  cursor:pointer;font-family:inherit;transition:.15s}
.star.on{color:var(--kin);text-shadow:0 0 11px rgba(229,180,90,.65)}
.star:active{transform:scale(.85)}
.star.pop{animation:pop .42s cubic-bezier(.34,1.56,.5,1)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.42) rotate(-12deg)}100%{transform:scale(1)}}
.fmk{color:var(--kin);font-weight:400;font-size:11px;font-family:-apple-system,sans-serif}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.tag{font-size:9.5px;padding:2px 7px;border-radius:3px;letter-spacing:.06em;font-weight:700}
.tag.g-f{background:rgba(226,101,60,.18);color:#ffa88c;border:1px solid rgba(226,101,60,.42)}
.tag.g-a{background:rgba(167,139,250,.16);color:#cbbcff;border:1px solid rgba(167,139,250,.45)}
.tag.g-m{background:rgba(111,191,155,.15);color:#8fdcb4;border:1px solid rgba(111,191,155,.42)}
.tag.g-o{background:rgba(111,182,232,.15);color:#9fd2f5;border:1px solid rgba(111,182,232,.42)}
.tag.f-free{background:rgba(99,185,143,.16);color:#8fdcb4;border:1px solid rgba(99,185,143,.45)}
.tag.f-part{background:rgba(229,180,90,.14);color:var(--kin);border:1px solid rgba(229,180,90,.42)}
.tag.f-paid{background:rgba(226,101,60,.16);color:#ffa88c;border:1px solid rgba(226,101,60,.45)}
.tm{font-size:11.5px;color:#ffe6b6;margin-top:4px;line-height:1.5}
.tm b{font-weight:700;font-size:9.5px;letter-spacing:.08em;color:var(--kin);
  border:1px solid rgba(229,180,90,.4);border-radius:3px;padding:1px 5px;margin-right:6px;vertical-align:1px}
.feeline{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:baseline;margin-bottom:8px;
  padding-bottom:8px;border-bottom:1px dotted rgba(244,238,226,.14)}
.feeline span{font-size:9.5px;letter-spacing:.06em;color:var(--muted)}
.tag.g-gen{background:rgba(244,238,226,.09);color:rgba(244,238,226,.8);border:1px solid rgba(244,238,226,.25)}
.tag.g-pref{background:rgba(244,238,226,.09);color:var(--muted)}
.tag.g-warn{background:rgba(229,180,90,.14);color:var(--kin);border:1px solid rgba(229,180,90,.35)}
.tag.g-past{background:rgba(244,238,226,.13);color:var(--muted)}
.tag.g-live{background:rgba(99,185,143,.18);color:#8fdcb4;border:1px solid rgba(99,185,143,.5)}
.tag.g-in{background:rgba(127,182,255,.14);color:#9fc7ff;border:1px solid rgba(127,182,255,.4)}
.tag.g-night{background:rgba(167,139,250,.13);color:#cbbcff;border:1px solid rgba(167,139,250,.38)}

.metrics{margin-top:9px;display:grid;gap:6px}
.metric{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:8px}
.metric span:first-child{font-size:9.5px;color:var(--muted);letter-spacing:.06em}
.bar{height:5px;border-radius:3px;background:rgba(244,238,226,.11);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.bar.term i{background:linear-gradient(90deg,var(--kin-d),var(--kin),#ffe9b8)}
.bar.crowd i{background:linear-gradient(90deg,#63b98f,#e5b45a,var(--kaki))}
.val{font-size:11px;font-variant-numeric:tabular-nums;font-weight:700}
.val.term{color:var(--kin)}
.val.crowd{color:#ffb8ab}

.note{max-height:0;opacity:0;overflow:hidden;margin-top:0;padding-top:0;
  border-top:1px dashed transparent;
  font-size:12px;color:rgba(244,238,226,.78);line-height:1.68;
  transition:max-height .36s cubic-bezier(.22,.72,.28,1),opacity .24s ease,
             margin-top .36s,padding-top .36s,border-color .3s}
.card.open .note{max-height:820px;opacity:1;margin-top:10px;padding-top:10px;
  border-top-color:rgba(244,238,226,.16)}
.card.open{background:rgba(255,255,255,.075)}
.link{display:inline-flex;align-items:center;gap:5px;margin-top:11px;padding:6px 13px;border-radius:999px;
  font-size:11.5px;font-weight:700;text-decoration:none;letter-spacing:.04em}
.link.off{background:var(--kin);color:#1d1607}
.link.sch{background:transparent;color:var(--kin);border:1px solid rgba(229,180,90,.5)}
.link:active{opacity:.7}

.cbar{display:flex;align-items:center;gap:7px;padding:0 16px}
.panel{position:relative;z-index:5;
  padding:11px 0 13px;max-height:0;overflow:hidden;opacity:0;visibility:hidden;overscroll-behavior:contain;
  transition:max-height .34s cubic-bezier(.22,.72,.28,1),opacity .2s ease,
             padding-top .34s,padding-bottom .34s,visibility 0s .34s}
.panel.open{opacity:1;visibility:visible;
  transition:max-height .34s cubic-bezier(.22,.72,.28,1),opacity .24s ease .04s,
             padding-top .34s,padding-bottom .34s,visibility 0s 0s}
.panel.done{overflow-y:auto}
.panel.free{overflow:visible}
.panel:not(.open){padding-top:0;padding-bottom:0}
.fbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:7px 15px;border-radius:999px;
  border:1px solid rgba(244,238,226,.22);background:rgba(255,255,255,.06);color:var(--kinari);
  font-size:12.5px;font-weight:700;font-family:inherit;letter-spacing:.04em;cursor:pointer;transition:.18s}
.fbtn i{font-style:normal;font-size:8px;transition:transform .2s;color:var(--kin)}
.fbtn[aria-expanded="true"]{background:var(--kin);border-color:var(--kin);color:#1d1607;box-shadow:0 0 16px rgba(229,180,90,.4)}
.fbtn[aria-expanded="true"] i{transform:rotate(180deg);color:#1d1607}
.fbtn b{min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--kaki);color:#fff;
  font-size:10px;line-height:16px;text-align:center;font-variant-numeric:tabular-nums}
.fbtn b:empty{display:none}
.fbtn[aria-expanded="true"] b{background:#3a2408}
.ccount{flex:1 1 auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccount em{font-style:normal;color:var(--kin);font-weight:700}
.row.foot{margin-top:10px;padding-top:10px;border-top:1px solid rgba(244,238,226,.1);gap:8px}
.txtbtn{flex:0 0 auto;padding:6px 15px;border-radius:999px;border:1px solid rgba(244,238,226,.2);
  background:none;color:var(--muted);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
.txtbtn.warn{color:#ffa88c;border-color:rgba(226,101,60,.4)}
.txtbtn:active{opacity:.6}
.mode{flex:0 0 auto;padding:7px 15px;border-radius:999px;border:1px solid rgba(244,238,226,.22);
  background:rgba(255,255,255,.06);color:var(--muted);font-size:12.5px;font-weight:700;
  font-family:inherit;letter-spacing:.04em;cursor:pointer;transition:.18s}
.mode[aria-pressed="true"]{background:var(--kin);border-color:var(--kin);color:#1d1607;box-shadow:0 0 16px rgba(229,180,90,.38)}

/* ── 早見表 ── */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.qt{display:flex;flex-direction:column;gap:3px;text-align:left;padding:9px 10px 10px;
  border:1px solid rgba(244,238,226,.12);border-radius:10px;background:var(--card);
  color:var(--kinari);font-family:inherit;cursor:pointer;transition:.16s;min-width:0}
.qt:active{transform:scale(.97)}
.qt.past{opacity:.4}
.qt.t-f{border-left:3px solid var(--kaki)}
.qt.t-a{border-left:3px solid var(--fuji)}
.qt.t-m{border-left:3px solid var(--koke)}
.qt.t-o{border-left:3px solid var(--tsuki)}
.qd{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:17px;font-weight:600;line-height:1.1;
  font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.qd i{font-style:normal;font-size:11.5px;color:var(--kin)}
.qd em{font-style:normal;font-size:10px;color:var(--muted);font-family:-apple-system,sans-serif}
.qd em.sat{color:#7fb6ff}.qd em.sun{color:#ff8f8f}
.qn{font-size:12px;font-weight:700;line-height:1.38;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qp{font-size:10px;color:var(--muted);line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── 会期表（ガント） ── */
.gtop{display:flex;align-items:center;gap:7px;margin:0 0 10px;flex-wrap:wrap}
.gnow{font-size:10.5px;color:var(--muted);margin:0;line-height:1.6;flex:1 1 160px}
.gnow b{color:var(--kinari);font-weight:600}
.zoom{flex:0 0 auto;padding:5px 13px;border-radius:999px;border:1px solid rgba(244,238,226,.22);
  background:rgba(255,255,255,.06);color:var(--muted);font-size:11.5px;font-weight:700;
  font-family:inherit;cursor:pointer;transition:.16s}
.zoom[aria-pressed="true"]{background:rgba(229,180,90,.9);border-color:var(--kin);color:#1d1607}

.gwrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  margin:0 -14px;padding-bottom:10px;scrollbar-width:thin}
.ginner{position:relative}
.gback{position:absolute;top:0;bottom:0;pointer-events:none;z-index:0}
.gback .wk{position:absolute;top:0;bottom:0;background:rgba(244,238,226,.035)}
.gback .mo{position:absolute;top:0;bottom:0;width:1px;background:rgba(229,180,90,.22)}
.gnowline{position:absolute;top:0;bottom:0;width:1.5px;z-index:2;pointer-events:none;
  background:#ff6b5a;box-shadow:0 0 8px rgba(255,107,90,.75)}

.grow{display:flex;align-items:stretch;width:100%;padding:0;background:none;border:0;
  color:var(--kinari);font-family:inherit;
  cursor:pointer;position:relative;text-align:left;min-height:34px}
.grow:active{background:rgba(255,255,255,.05)}
.grow.past{opacity:.4}
.ghead{cursor:default;position:relative;z-index:4}
.ghead:active{background:none}
.glabel{position:sticky;left:0;z-index:3;flex:0 0 auto;padding:5px 8px 5px 14px;min-width:0;
  background:#191424;display:flex;flex-direction:column;justify-content:center;gap:1px;
  box-shadow:1px 0 0 rgba(244,238,226,.09),inset 0 -1px 0 rgba(244,238,226,.07)}
.ghead .glabel{box-shadow:1px 0 0 rgba(244,238,226,.09),inset 0 -1px 0 var(--line)}
.ghead .glabel{background:#191424;color:var(--muted);font-size:9.5px;letter-spacing:.06em;justify-content:flex-end;padding-bottom:4px}
.glabel .gn{font-size:11px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glabel .gd{font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.gplot{position:relative;flex:0 0 auto;box-shadow:inset 0 -1px 0 rgba(244,238,226,.07)}
.ghead .gplot{box-shadow:inset 0 -1px 0 var(--line)}
.gbar{position:absolute;top:50%;margin-top:-7px;height:14px;border-radius:3px;overflow:hidden;
  box-shadow:0 1px 5px rgba(0,0,0,.35);
  transform-origin:left center;animation:grow .5s cubic-bezier(.22,.72,.28,1) backwards}
@keyframes grow{from{transform:scaleX(0);opacity:.4}to{transform:scaleX(1);opacity:1}}
.gnowline{animation:fadein .5s ease .25s backwards}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.gbar u{position:absolute;left:0;top:0;bottom:0;text-decoration:none;background:rgba(255,255,255,.42)}
.grow.t-f .gbar{background:var(--kaki)}
.grow.t-a .gbar{background:var(--fuji)}
.grow.t-m .gbar{background:var(--koke)}
.grow.t-o .gbar{background:var(--tsuki)}
.gmo{position:absolute;top:0;height:17px;font-size:10px;line-height:17px;letter-spacing:.06em;
  color:var(--kin);border-left:1px solid rgba(229,180,90,.3);padding-left:5px;white-space:nowrap;overflow:hidden}
.gdy{position:absolute;top:18px;height:16px;font-size:8.5px;line-height:16px;text-align:center;
  color:var(--muted);font-variant-numeric:tabular-nums}
.gdy.we{color:#ffa88c}
.gdy.wk6{color:#8fc4ff}
.gwk{position:absolute;top:18px;height:16px;font-size:8.5px;line-height:16px;
  color:rgba(244,238,226,.4);border-left:1px solid rgba(244,238,226,.13);padding-left:3px;white-space:nowrap;overflow:hidden}
.glegend{font-size:10px;color:var(--muted);margin:8px 2px 0;line-height:1.6}

/* 開ききったあとの状態。収まりきるなら切り抜きを外して、チップの光がはみ出せるようにする */
function settle(p,cap){
  if(p.scrollHeight>cap){p.style.maxHeight=cap+'px';p.classList.add('done')}
  else{p.style.maxHeight='none';p.classList.add('free')}
}
/* パネルの開閉（高さをアニメーションさせる） */
let panelT=null;
function panelCap(){return Math.round((window.innerHeight||800)*.62)}
function setPanel(open,anim){
  const p=$('panel'),b=$('btnFilter');
  if(!p)return;
  b.setAttribute('aria-expanded',open);

  clearTimeout(panelT);
  p.classList.remove('done','free');
  p.style.overflow='';
  const cap=panelCap();
  if(!anim){
    p.style.transition='none';
    p.classList.toggle('open',open);
    p.style.maxHeight=open?cap+'px':'0px';
    if(open)settle(p,cap);
    p.offsetHeight;
    p.style.transition='';
    return;
  }
  if(open){
    p.classList.add('open');
    p.style.maxHeight=Math.min(p.scrollHeight+12,cap)+'px';
    panelT=setTimeout(()=>settle(p,cap),360);
  }else{
    /* パネルが画面より上にあるときは、閉じたぶんスクロール位置を詰めて表示を動かさない */
    const r=p.getBoundingClientRect?p.getBoundingClientRect():null;
    const h=p.offsetHeight||0;
    if(r&&r.bottom<=0){
      p.style.transition='none';
      p.classList.remove('open');
      p.style.maxHeight='0px';
      p.offsetHeight;
      p.style.transition='';
      window.scrollBy(0,-h);
      return;
    }
    p.style.maxHeight=Math.min(p.scrollHeight+12,cap)+'px';
    p.offsetHeight;
    p.classList.remove('open');
    p.style.maxHeight='0px';
  }
}

/* 現在地 */
let geo=null,geoState='idle';
const R=6371;
function distKm(x){
  if(!geo)return null;
  const r=d=>d*Math.PI/180;
  const dla=r(x.la-geo.la),dlo=r(x.lo-geo.lo);
  const a=Math.sin(dla/2)**2+Math.cos(r(geo.la))*Math.cos(r(x.la))*Math.sin(dlo/2)**2;
  return R*2*Math.asin(Math.sqrt(a));
}
const fmtKm=k=>k==null?'':(k<10?k.toFixed(1):Math.round(k))+'km';
function askGeo(){
  const el=$('geo');
  if(!navigator.geolocation){geoState='err';el.hidden=false;el.className='geomsg err';
    el.textContent='この環境では現在地を取得できません。別の並べ替えをお使いください。';return}
  geoState='loading';el.hidden=false;el.className='geomsg';el.textContent='現在地を取得しています…';
  navigator.geolocation.getCurrentPosition(
    pos=>{geo={la:pos.coords.latitude,lo:pos.coords.longitude};geoState='ok';render()},
    err=>{geoState='err';el.hidden=false;el.className='geomsg err';
      el.textContent=err.code===1
        ?'位置情報の利用が許可されませんでした。ブラウザの設定から許可すると、現在地から近い順に並べ替えられます。'
        :'現在地を取得できませんでした。時間をおいて試すか、別の並べ替えをお使いください。';
      render()},
    {enableHighAccuracy:false,timeout:10000,maximumAge:300000});
}

/* 集計の数字をなめらかに動かす */
const numT={};
function setNum(id,to){
  const el=$(id);if(!el)return;
  const from=parseInt(el.textContent,10)||0;
  if(from===to){el.textContent=to;return}
  cancelAnimationFrame(numT[id]);
  const t0=performance.now(),D=420;
  const step=t=>{
    const k=Math.max(0,Math.min(1,(t-t0)/D)),e=1-Math.pow(1-k,3);
    el.textContent=Math.round(from+(to-from)*e);
    if(k<1)numT[id]=requestAnimationFrame(step);
  };
  numT[id]=requestAnimationFrame(step);
}

    if(st.genre!=='all'&&x.g!==st.genre)return false;
    if(st.fee!=='all'&&x.f!==st.fee)return false;
    if(st.nopaid&&x.f==='paid')return false;
    if(st.fav&&!isFav(x.n))return false;
    if(st.rain&&x.in==='out')return false;
    if(st.night&&!x.nt)return false;
    if(st.live&&!isLive(x))return false;
    if(!st.past&&ed(x)<today)return false;
    if(q&&!(x.n+x.pl+x.p+x.a+(x.g||'')).toLowerCase().includes(q))return false;
    return true;
  });

  const S={
    date:(a,b)=>sd(a)-sd(b)||ed(a)-ed(b),
    endSoon:(a,b)=>ed(a)-ed(b)||sd(a)-sd(b),
    long:(a,b)=>span(b)-span(a)||sd(a)-sd(b),
    crowdHi:(a,b)=>b.c-a.c||sd(a)-sd(b),
    crowdLo:(a,b)=>a.c-b.c||sd(a)-sd(b),
    near:(a,b)=>geo?(distKm(a)-distKm(b)):(sd(a)-sd(b))
  };
  rows.sort(S[st.sort]);

  setNum('tAll',rows.length);
  setNum('tToday',rows.filter(isLive).length);

  $('btnGantt').setAttribute('aria-pressed',st.gantt);
  $('past').disabled=st.live;$('lbPast').className='toggle'+(st.live?' dim':'');
  if(!rows.length){
    L.innerHTML=st.fav&&!FAV.size
      ?'<div class="empty"><b>☆</b>お気に入りはまだありません。<br>カード右上の星をタップすると、ここに集まります。</div>'
      :'<div class="empty"><b>🍂</b>条件に合うものが見つかりませんでした。<br>フィルターを緩めるか、「お気に入りのみ」「夜が主役」「雨でも行ける」をオフにしてみてください。</div>';

  }
  const gm=$('geo');

  }else if(st.sort!=='near'){gm.hidden=true}

  if(st.gantt){L.appendChild(gantt(rows));return}

  /* 日付順のときだけ月で区切る。それ以外は全件を通して並べ替える */
  const flat=st.sort!=='date',one=st.live||flat;

      inM.forEach(x=>{const c=card(x);
        if(pending===x.n){c.classList.add('open');requestAnimationFrame(()=>c.scrollIntoView({block:'center'}))}
        L.appendChild(c)});
    }
  });
  pending=null;
}

function leftLabel(x){

/* 会期の進み具合（0〜1） */
function progress(x){
  const s=sd(x),e=ed(x);
  if(today<s)return 0;
  if(today>e)return 1;
  const total=(e-s)/DAY;
  return total<=0?1:Math.min(1,((today-s)/DAY+1)/(total+1));
}

/* 早見表タイル */
function tile(x){
  const start=dt(x.d),past=ed(x)<today;
  const a=document.createElement('button');
  a.type='button';
  a.className='qt t-'+x.t+(past?' past':'');
  const live=isLive(x);
  const wd=WD[start.getDay()],wc=start.getDay()===0?'sun':start.getDay()===6?'sat':'';
  a.innerHTML=`<span class="qd">${isFav(x.n)?'<b class="fmk">\u2605</b>':''}${md(x.d)}${x.d2?`<i class="${live?'live':''}">〜${md(x.d2)}</i>`:''}<em class="${wc}">${wd}</em></span>
    <span class="qn">${esc(x.n)}</span>
    <span class="qp">${esc(x.pl.split('／')[0])}</span>
    ${geo?`<span class="qdist">${fmtKm(distKm(x))}</span>`:''}`;
  a.onclick=()=>{st.quick=false;pending=x.n;render()};
  return a;
}

/* 会期表（ガントチャート） */
const idx=d=>Math.round((d-T0)/DAY);
function gantt(rows){
  const wrap=document.createElement('div');
  const day=st.gz==='day';
  const NDAYS=idx(day?TEND.day:TEND.fit)+1;
  const LW=day?128:120;
  const avail=($('list')&&$('list').clientWidth)||360;
  const cw=day?17:Math.max(1.8,(avail-LW)/NDAYS);
  const PW=cw*NDAYS;
  const nowIn=idx(today)>=0&&idx(today)<NDAYS,nowX=idx(today)*cw;

  wrap.innerHTML=`<div class="mhead srt"><b>会期表</b><s></s><i>${rows.length}件</i></div>
    <div class="gtop">
      <p class="gnow">赤い縦線が<b>今日（${today.getMonth()+1}/${today.getDate()}）</b>。行をタップすると詳細が開きます。</p>
      <button type="button" class="zoom" id="zAll" aria-pressed="${!day}">全体</button>
      <button type="button" class="zoom" id="zDay" aria-pressed="${day}">日ごと</button>
    </div>`;

  const scroll=document.createElement('div');scroll.className='gwrap';
  const inner=document.createElement('div');inner.className='ginner';
  inner.style.width=(LW+PW)+'px';

  /* 背景（週の縞・月境・今日） */
  const back=document.createElement('div');back.className='gback';
  back.style.left=LW+'px';back.style.width=PW+'px';
  let bh='';
  for(let i=0;i<NDAYS;i++){
    const d=new Date(+T0+i*DAY),w=d.getDay();
    if(day){ if(w===0||w===6) bh+=`<div class="wk" style="left:${i*cw}px;width:${cw}px"></div>`; }
    else if(w===6) bh+=`<div class="wk" style="left:${i*cw}px;width:${cw*2}px"></div>`;
    if(d.getDate()===1&&i>0) bh+=`<div class="mo" style="left:${i*cw}px"></div>`;
  }
  back.innerHTML=bh;
  inner.appendChild(back);
  if(nowIn){const nl=document.createElement('div');nl.className='gnowline';
    nl.style.left=(LW+nowX)+'px';inner.appendChild(nl)}

  /* ヘッダー（月・日） */
  const head=document.createElement('div');head.className='grow ghead';
  let hh='';
  [9,10,11,12].forEach(m=>{
    const s=Math.max(0,idx(new Date(2026,m-1,1)));
    const e=Math.min(NDAYS-1,idx(new Date(2026,m,0)));
    if(e<s)return;
    hh+=`<div class="gmo" style="left:${s*cw}px;width:${(e-s+1)*cw}px">${m}月</div>`;
  });
  if(day){
    for(let i=0;i<NDAYS;i++){
      const d=new Date(+T0+i*DAY),w=d.getDay();
      hh+=`<div class="gdy${w===0?' we':w===6?' wk6':''}" style="left:${i*cw}px;width:${cw}px">${d.getDate()}</div>`;
    }
  }
  head.innerHTML=`<div class="glabel" style="flex-basis:${LW}px;width:${LW}px">イベント</div>
    <div class="gplot" style="width:${PW}px;height:${day?36:20}px">${hh}</div>`;
  inner.appendChild(head);

  /* 各行 */
  const sorted=rows.slice().sort((a,b)=>sd(a)-sd(b)||ed(a)-ed(b));
  sorted.forEach((x,i)=>{
    const past=ed(x)<today;
    const b=document.createElement('button');
    b.type='button';
    b.className='grow t-'+x.t+(past?' past':'');
    const s=Math.max(0,idx(sd(x))),e=Math.min(NDAYS-1,idx(ed(x)));
    const bx=s*cw,bw=Math.max(3,(e-s+1)*cw-1);
    const done=Math.round(progress(x)*100);
    b.innerHTML=`<div class="glabel" style="flex-basis:${LW}px;width:${LW}px">
        <span class="gn">${isFav(x.n)?'<b class="fmk">\u2605</b> ':''}${esc(x.n)}</span>
        <span class="gd">${md(x.d)}〜${md(x.d2||x.d)}・${span(x)}日</span>
      </div>
      <div class="gplot" style="width:${PW}px">
        <div class="gbar" style="left:${bx}px;width:${bw}px;animation-delay:${Math.min(i,14)*45}ms">${done>0?`<u style="width:${done}%"></u>`:''}</div>
      </div>`;
    b.onclick=()=>{st.gantt=false;pending=x.n;render()};
    inner.appendChild(b);
  });

  scroll.appendChild(inner);
  wrap.appendChild(scroll);
  const lg=document.createElement('p');lg.className='glegend';
  lg.textContent='バーの薄い部分が経過ぶん、濃い部分がこれから残っている会期です。'+(day?'左右にスクロールできます。':'「日ごと」に切り替えると日付の目盛りが出ます。');
  wrap.appendChild(lg);

  /* スクロール位置と拡大切替 */
  requestAnimationFrame(()=>{
    if(day&&nowIn)scroll.scrollLeft=Math.max(0,nowX-60);
    const za=$('zAll'),zd=$('zDay');
    if(za)za.onclick=()=>{st.gz='fit';render()};
    if(zd)zd.onclick=()=>{st.gz='day';render()};
  });
  return wrap;
}

function card(x){
  const start=dt(x.d),past=ed(x)<today,live=isLive(x);
  const c=document.createElement('article');
  c.className='card '+x.t+(past?' past':'');
  c.tabIndex=0;
  const wcls=start.getDay()===0?'sun':start.getDay()===6?'sat':'';
  const sp=x.d2?`〜${md(x.d2)}`:'';
  const href=x.u||('https://www.google.com/search?q='+encodeURIComponent(x.n+' 2026 公式'));
  const lbl=x.u?(x.ut||'公式サイト'):'公式情報を検索';
  const ind=INDOOR[x.in]||'';

  const on=isFav(x.n);
  c.innerHTML=`
    <button type="button" class="star${on?' on':''}" aria-pressed="${on}" aria-label="お気に入りに追加">${on?'\u2605':'\u2606'}</button>
    <div class="dt">
      <span class="m">${+x.d.slice(5,7)}月</span>
      <span class="d">${+x.d.slice(8,10)}</span>
      <span class="w ${wcls}">${WD[start.getDay()]}</span>
      ${sp?`<span class="sp${live?' live':''}">${sp}</span>`:''}
    </div>
    <div class="body">
      <div class="nm">${esc(x.n)}</div>
      <div class="pl">${esc(x.pl)}</div>
      ${x.tm?`<div class="tm"><b>時間</b>${esc(x.tm)}</div>`:''}
      <div class="tags">
        <span class="tag g-${x.t}">${TYPE[x.t]}</span>
        <span class="tag f-${x.f}">${FEEL[x.f]}</span>
        ${geo?`<span class="tag g-pref dist">${fmtKm(distKm(x))}</span>`:''}
        ${x.g?`<span class="tag g-gen">${x.g}</span>`:''}
        <span class="tag g-pref">${x.p}・${x.a}</span>
        ${ind?`<span class="tag g-in">${ind}</span>`:''}
        ${x.nt?'<span class="tag g-night">夜が主役</span>':''}
        ${x.sk?'<span class="tag g-warn">とびとび開催</span>':''}
        ${x.est?'<span class="tag g-warn">日程めやす</span>':''}
        ${live?'<span class="tag g-live">開催中</span>':''}
        ${past?'<span class="tag g-past">終了</span>':''}
      </div>
      <div class="metrics">
        <div class="metric"><span>会期</span>
          <div class="bar term"><i style="width:${Math.round(progress(x)*100)}%"></i></div>
          <span class="val term">${leftLabel(x)}</span></div>
        <div class="metric"><span>混雑</span>
          <div class="bar crowd"><i style="width:${x.c*20}%"></i></div>
          <span class="val crowd">${CROWD[x.c]}</span></div>
      </div>
      <div class="note">
        <div class="feeline"><span>会期</span>${md(x.d)}〜${md(x.d2||x.d)}（${span(x)}日間）</div>
        ${x.sk?`<div class="feeline"><span>実施日</span>${esc(x.sk)}</div>`:''}
        <div class="feeline"><span>時間</span>${x.tm?esc(x.tm):'2026年の開催時間は未確認です。公式サイトでご確認ください。'}</div>
        <div class="feeline"><span>料金</span>${esc(x.fee)}</div>${esc(x.note)}
        <br><a class="link ${x.u?'off':'sch'}" href="${href}" target="_blank" rel="noopener">${lbl} ↗</a>
      </div>
    </div>`;

  c.querySelector('.link').onclick=e=>e.stopPropagation();
  const stb=c.querySelector('.star');
  stb.onclick=e=>{
    e.stopPropagation();
    toggleFav(x.n);
    const v=isFav(x.n);
    stb.className='star'+(v?' on':'');
    stb.textContent=v?'\u2605':'\u2606';
    stb.setAttribute('aria-pressed',v);
    if(v){stb.classList.remove('pop');stb.offsetWidth;stb.classList.add('pop');
      stb.addEventListener('animationend',()=>stb.classList.remove('pop'),{once:true})}
    $('favN').textContent=FAV.size?'（'+FAV.size+'）':'';
    if(st.fav)render();
  };
  const tog=()=>c.classList.toggle('open');
  c.onclick=tog;
  c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog()}};
  return c;
}

/* ══ 全体の星空（スクロールに追従しない固定背景） ══ */
(function(){
  const cv=$('stars');if(!cv)return;
  const ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,dpr,stars=[];
  function size(){
    dpr=Math.min(devicePixelRatio||1,2);
    W=cv.clientWidth||window.innerWidth;H=cv.clientHeight||window.innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.max(40,Math.round(W*H/8200));
    stars=[];
    for(let i=0;i<n;i++)stars.push({
      x:Math.random()*W,y:Math.random()*H,
      r:Math.random()*1.15+.25,
      a:Math.random()*6.28,s:.005+Math.random()*.015,
      b:.5+Math.random()*.5});
  }
  size();addEventListener('resize',size);
  function loop(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#fff4dc';
    stars.forEach(t=>{
      t.a+=t.s;
      ctx.globalAlpha=(.14+Math.max(0,Math.sin(t.a))*.3)*t.b;
      ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,7);ctx.fill();
    });
    ctx.globalAlpha=1;
    if(!reduce)requestAnimationFrame(loop);
  }
  loop();
})();

/* ══ ヒーローの夜空（月と落ち葉） ══ */
(function(){
  const cv=$('sky'),ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,dpr;
  function size(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  size();addEventListener('resize',size);
  const HUES=[26,16,38,8,44];
  let leaves=[];
  function mk(y){return{x:Math.random()*W,y:y==null?Math.random()*H:y,
    vy:.22+Math.random()*.4,vx:(Math.random()-.5)*.34,
    r:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.035,
    s:4.5+Math.random()*5,hue:HUES[(Math.random()*HUES.length)|0],a:.35+Math.random()*.45}}
  for(let i=0;i<24;i++)leaves.push(mk());
  function moon(){
    const mx=W*.8,my=H*.26,r=Math.min(24,W*.055);
    const g=ctx.createRadialGradient(mx,my,r*.4,mx,my,r*3.4);
    g.addColorStop(0,'rgba(255,236,190,.32)');g.addColorStop(1,'rgba(255,236,190,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(mx,my,r*3.4,0,7);ctx.fill();
    ctx.fillStyle='#ffeec4';ctx.beginPath();ctx.arc(mx,my,r,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,236,196,.13)';
    ctx.beginPath();ctx.arc(mx-r*.3,my-r*.25,r*.22,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(mx+r*.28,my+r*.3,r*.16,0,7);ctx.fill();
  }
  function drawLeaf(l){
    ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.r);
    ctx.fillStyle=`hsla(${l.hue},72%,58%,${l.a})`;
    ctx.beginPath();
    ctx.moveTo(0,-l.s);
    ctx.quadraticCurveTo(l.s*.9,-l.s*.2,0,l.s);
    ctx.quadraticCurveTo(-l.s*.9,-l.s*.2,0,-l.s);
    ctx.fill();
    ctx.restore();
  }
  function loop(){
    ctx.clearRect(0,0,W,H);
    moon();
    leaves.forEach((l,i)=>{
      l.y+=l.vy;l.x+=l.vx+Math.sin(l.y/38)*.28;l.r+=l.vr;
      if(l.y>H+14)leaves[i]=mk(-14);
      drawLeaf(l);
    });
    if(!reduce)requestAnimationFrame(loop);
  }
  loop();
})();
</script>
